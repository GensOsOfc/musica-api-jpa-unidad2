# ======================================================================
# Persistencia con H2 (base de datos embebida, en ARCHIVO)
# ======================================================================
# El archivo se guarda en ./data/cancionesdb.mv.db. Al usar un archivo
# (en lugar de la base en memoria jdbc:h2:mem:...), los datos sobreviven
# al reiniciar la aplicación: es la evidencia de que la persistencia es real.
spring.datasource.url=jdbc:h2:file:./data/cancionesdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ======================================================================
# JPA / Hibernate
# ======================================================================
# 'update' hace que Hibernate cree o actualice el esquema de la tabla
# a partir de la entidad, sin borrar los datos existentes.
spring.jpa.hibernate.ddl-auto=update

# Muestra en consola el SQL que Hibernate ejecuta (útil para el video).
spring.jpa.show-sql=true

# ======================================================================
# Consola web de H2 (opcional, para inspeccionar la base)
# ======================================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Nombre de la app (aparece en los logs de arranque)
spring.application.name=musica-api-jpa
